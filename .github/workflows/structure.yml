name: structure

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/node/build-index.mjs --check
      # Publication invariants. Depends only on tracked files, so it runs on a
      # clean checkout unlike the runtimes that previously imported from .tmp/.
      - run: node scripts/node/publication-evidence-check.mjs
      # Mail2Blogger posting address is a publishing credential; the repo is public.
      - run: node scripts/node/secret-address-check.mjs --tree
